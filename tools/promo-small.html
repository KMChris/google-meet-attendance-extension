<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=440, initial-scale=1">
  <title>Attendance Tracker · Small promo</title>
  <link rel="stylesheet" href="/src/lib/ui.css">
  <style>
    *{box-sizing:border-box}
    html,body{width:440px;height:280px;margin:0;overflow:hidden;background:#08110d}
    body{color:#edf4ef;font-family:var(--sans)}
    .tile{position:relative;width:100%;height:100%;padding:30px 32px;background:
      radial-gradient(circle at 18% 8%,rgba(82,200,154,.22),transparent 43%),
      radial-gradient(circle at 90% 95%,rgba(215,170,75,.14),transparent 44%),#08110d}
    .tile:after{content:"";position:absolute;inset:0;opacity:.26;background-image:linear-gradient(rgba(139,174,155,.12) 1px,transparent 1px),linear-gradient(90deg,rgba(139,174,155,.12) 1px,transparent 1px);background-size:28px 28px;mask-image:linear-gradient(to bottom,black,transparent 78%)}
    .brand{position:relative;z-index:1;display:flex;align-items:center;gap:11px;font-family:var(--disp);font-size:21px;font-weight:700}
    .sep{color:#52c89a}
    .signal{position:relative;z-index:1;margin-top:34px;border:1px solid rgba(159,190,173,.24);background:rgba(15,27,20,.78);border-radius:16px;padding:17px 18px 16px;box-shadow:0 20px 45px rgba(0,0,0,.24)}
    .metric{display:flex;align-items:end;justify-content:space-between;margin-bottom:14px}
    .metric b{font:700 36px/1 var(--disp)}
    .metric span{font:500 10px var(--mono);letter-spacing:.12em;color:#8ea99a}
    .timeline{display:flex;gap:5px;height:14px}.timeline i{display:block;border-radius:4px;background:#52c89a}.timeline i:nth-child(1){width:29%}.timeline i:nth-child(2){width:18%;background:#2e5947}.timeline i:nth-child(3){width:35%}.timeline i:nth-child(4){width:12%;background:#d7aa4b}.timeline i:nth-child(5){flex:1;background:#52c89a}
  </style>
</head>
<body>
  <main class="tile">
    <div class="brand">
      <svg width="34" height="34" viewBox="0 0 30 30" fill="none" aria-hidden="true">
        <rect x="1.5" y="1.5" width="27" height="27" rx="8" fill="#111c16" stroke="#355344" stroke-width="1.5"/>
        <rect x="7" y="8.5" width="16" height="3.4" rx="1.7" fill="#52c89a"/>
        <rect x="7" y="13.4" width="10" height="3.4" rx="1.7" fill="#355344"/>
        <rect x="7" y="18.3" width="13" height="3.4" rx="1.7" fill="#d7aa4b"/>
      </svg>
      <span>Attendance<span class="sep">·</span>Tracker</span>
    </div>
    <section class="signal">
      <div class="metric"><b>91%</b><span data-en="PRESENCE">FREKWENCJA</span></div>
      <div class="timeline"><i></i><i></i><i></i><i></i><i></i></div>
    </section>
  </main>
  <script>
    if (new URLSearchParams(location.search).get('lang') === 'en') {
      document.documentElement.lang = 'en';
      document.querySelectorAll('[data-en]').forEach(element => { element.textContent = element.dataset.en; });
    }
  </script>
</body>
</html>
