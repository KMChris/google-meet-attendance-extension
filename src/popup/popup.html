<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Attendance Tracker</title>
  <link rel="stylesheet" href="../lib/ui.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body class="popup">
  <header class="pop-head">
    <div class="brand">
      <svg width="24" height="24" viewBox="0 0 30 30" fill="none" aria-hidden="true">
        <rect x="1.5" y="1.5" width="27" height="27" rx="8" fill="var(--panel)" stroke="var(--line-2)" stroke-width="1.5"/>
        <rect x="7" y="8.5" width="16" height="3.4" rx="1.7" fill="var(--present)"/>
        <rect x="7" y="13.4" width="10" height="3.4" rx="1.7" fill="var(--line-2)"/>
        <rect x="7" y="18.3" width="13" height="3.4" rx="1.7" fill="var(--late)"/>
      </svg>
      <span class="name">Attendance<span class="sep">·</span>Tracker</span>
    </div>
    <span class="status status--info" id="pop-status">—</span>
  </header>

  <div class="live-card" id="live-card">
    <div class="live-main">
      <div class="live-count" id="live-count">—</div>
      <div class="live-label eyebrow" id="live-label" data-i18n="popupInThisCall"></div>
    </div>
    <button class="btn ghost sm" id="btn-export-live" hidden data-i18n="popupExport"></button>
  </div>

  <div class="recent">
    <div class="recent-head"><span class="eyebrow" data-i18n="popupRecent"></span><button class="link-btn" id="view-all" data-i18n="popupViewAll"></button></div>
    <div id="recent-list"></div>
    <div class="recent-empty eyebrow" id="recent-empty" data-i18n="popupNoRecent" hidden></div>
  </div>

  <button class="btn block" id="open-dash" data-i18n="popupOpenDashboard"></button>

  <script type="module" src="popup.js"></script>
</body>
</html>
