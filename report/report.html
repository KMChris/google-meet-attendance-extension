<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Attendance Tracker — report</title>
  <link rel="stylesheet" href="../src/lib/ui.css">
  <link rel="stylesheet" href="report.css">
</head>
<body class="report-body">
  <div class="report-toolbar no-print">
    <div class="tb-brand">
      <svg width="24" height="24" viewBox="0 0 30 30" fill="none" aria-hidden="true">
        <rect x="1.5" y="1.5" width="27" height="27" rx="8" fill="#fff" stroke="#cfd6d0" stroke-width="1.5"/>
        <rect x="7" y="8.5" width="16" height="3.4" rx="1.7" fill="#1e7a4e"/>
        <rect x="7" y="13.4" width="10" height="3.4" rx="1.7" fill="#cfd6d0"/>
        <rect x="7" y="18.3" width="13" height="3.4" rx="1.7" fill="#bd7a15"/>
      </svg>
      <span>Attendance·Tracker</span>
    </div>
    <div class="tb-actions">
      <button class="btn ghost no-print" id="btn-back">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
        <span data-i18n="backToApp">Back</span>
      </button>
      <button class="btn" id="btn-print">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M7 8V3h10v5"/><path d="M7 18H5a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M7 14h10v7H7z"/></svg>
        <span data-i18n="printReport">Save as PDF</span>
      </button>
    </div>
  </div>

  <main class="report-root" id="report"></main>

  <script type="module" src="report.js"></script>
</body>
</html>
