<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Attendance Tracker</title>
  <link rel="stylesheet" href="../src/lib/ui.css">
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
<div class="app">

  <!-- masthead -->
  <header class="masthead">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 30 30" fill="none" aria-hidden="true">
        <rect x="1.5" y="1.5" width="27" height="27" rx="8" fill="var(--panel)" stroke="var(--line-2)" stroke-width="1.5"/>
        <rect x="7" y="8.5" width="16" height="3.4" rx="1.7" fill="var(--present)"/>
        <rect x="7" y="13.4" width="10" height="3.4" rx="1.7" fill="var(--line-2)"/>
        <rect x="7" y="18.3" width="13" height="3.4" rx="1.7" fill="var(--late)"/>
      </svg>
      <span class="name">Attendance<span class="sep">·</span>Tracker</span>
    </div>
    <div class="readout mono" id="readout"></div>
  </header>

  <!-- tab rail -->
  <nav class="tabrail" id="tabrail">
    <button class="tab on" data-view="meetings" data-i18n="navMeetings">Meetings</button>
    <button class="tab" data-view="groups" data-i18n="navGroups">Series</button>
    <button class="tab" data-view="people" data-i18n="navPeople">People</button>
    <button class="tab" data-view="analytics" data-i18n="navAnalytics">Analytics</button>
    <button class="tab" data-view="settings" data-i18n="navSettings">Settings</button>
  </nav>

  <main>
    <!-- ============ MEETINGS ============ -->
    <section class="view on" id="view-meetings">
      <div class="view-head">
        <div>
          <div class="eyebrow" data-i18n="navMeetings">Meetings</div>
          <p class="lede" data-i18n="meetingsSubtitle"></p>
        </div>
        <div class="head-actions">
          <div class="search">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
            <input class="field" id="meeting-search" data-i18n-placeholder="searchMeetings" data-i18n-aria="searchMeetings">
          </div>
          <button class="btn ghost" id="btn-meetings-archive" aria-pressed="false">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="4" width="18" height="5" rx="1.2"/><path d="M5 9v10.5h14V9M10 13h4"/></svg>
            <span class="lbl"></span>
          </button>
          <button class="btn ghost" id="btn-meetings-trash" aria-pressed="false">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>
            <span class="lbl"></span>
          </button>
          <button class="btn subtle" id="btn-trash-empty" hidden>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/><path d="m10 10.5 4 5m0-5-4 5"/></svg>
            <span data-i18n="trashEmpty"></span>
          </button>
          <button class="btn ghost" id="btn-export-all">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3v12m0 0 4.5-4.5M12 15l-4.5-4.5"/><path d="M4 16.5V19a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2.5"/></svg>
            <span data-i18n="export">Export</span>
          </button>
          <div class="menu" id="export-all-menu" hidden>
            <button class="menu-item" data-format="json">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M8 3.5H7a2 2 0 0 0-2 2v3.5a2.5 2.5 0 0 1-2.5 2.5a2.5 2.5 0 0 1 2.5 2.5V18a2 2 0 0 0 2 2h1"/><path d="M16 3.5h1a2 2 0 0 1 2 2V9a2.5 2.5 0 0 0 2.5 2.5a2.5 2.5 0 0 0-2.5 2.5V18a2 2 0 0 1-2 2h-1"/></svg>
              <span>JSON</span>
            </button>
            <button class="menu-item" data-format="csv">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9.5h18M9 9.5V20"/></svg>
              <span>CSV</span>
            </button>
          </div>
        </div>
      </div>

      <div class="stats" id="meetings-stats">
        <div class="stat"><div class="k" id="stat-meetings">—</div><div class="lbl eyebrow" data-i18n="statMeetings"></div></div>
        <div class="stat"><div class="k" id="stat-people">—</div><div class="lbl eyebrow" data-i18n="statPeople"></div></div>
        <div class="stat"><div class="k" id="stat-length">—</div><div class="lbl eyebrow" data-i18n="statAvgLength"></div></div>
        <div class="stat"><div class="k" id="stat-attendance">—</div><div class="lbl eyebrow" data-i18n="statAvgAttendance"></div></div>
      </div>

      <div class="card list-card" id="meetings-table">
        <div class="list-head meetings-grid">
          <span data-i18n="colDate"></span><span data-i18n="colMeeting"></span>
          <span data-i18n="colGroup"></span><span class="num" data-i18n="colPeople"></span>
          <span class="num" data-i18n="colAvgTime"></span><span></span>
        </div>
        <div id="meetings-body"></div>
        <div class="pager" id="meetings-pager" hidden></div>
      </div>
      <div class="empty" id="meetings-empty">
        <div class="mark"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/></svg></div>
        <h3 data-i18n="emptyMeetingsTitle" id="meetings-empty-title"></h3>
        <p data-i18n="emptyMeetingsBody" id="meetings-empty-body"></p>
      </div>
    </section>

    <!-- ============ MEETING DETAIL ============ -->
    <section class="view" id="view-detail">
      <button class="back" id="btn-back-detail"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg><span data-i18n="navMeetings"></span></button>

      <div class="card detail-card">
        <div class="detail-head">
          <div class="detail-headings">
            <div class="eyebrow" id="detail-eyebrow"></div>
            <div class="title-line">
              <div class="title-slot">
                <h1 id="detail-title"></h1>
                <input class="field rename-input" id="rename-input" data-i18n-aria="rename" hidden>
              </div>
              <button class="title-edit" id="btn-rename" data-i18n-title="rename" data-i18n-aria="rename"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg></button>
              <button class="title-edit" id="btn-meeting-archive"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="5" rx="1.2"/><path d="M5 9v10.5h14V9M10 13h4"/></svg></button>
            </div>
            <div class="detail-badges">
              <button class="badge hours-badge" id="btn-hours">
                <svg class="hb-ic" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>
                <span id="hours-value"></span>
                <svg class="badge-tool" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>
              </button>
              <!-- which series this meeting belongs to is a property of it, so it reads as a badge
                   beside the hours and changes right there, not in a modal over the whole page -->
              <div class="badge-menu">
                <button class="badge group-badge" id="btn-group" aria-haspopup="true" aria-expanded="false">
                  <span class="gdot" id="group-badge-dot"></span>
                  <span id="group-badge-name"></span>
                </button>
                <button class="badge group-caret" id="btn-group-menu" aria-haspopup="true" aria-expanded="false" data-i18n-title="changeGroup" data-i18n-aria="changeGroup" hidden>
                  <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m6 9 6 6 6-6"/></svg>
                </button>
                <div class="menu group-menu" id="group-menu" role="menu" hidden></div>
              </div>
              <div class="detail-meta mono" id="detail-meta"></div>
            </div>
          </div>
          <div class="detail-actions">
            <button class="btn ghost" id="btn-export">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3v12m0 0 4.5-4.5M12 15l-4.5-4.5"/><path d="M4 16.5V19a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2.5"/></svg>
              <span data-i18n="exportCsv">Export CSV</span>
            </button>
            <button class="btn" id="btn-pdf">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13.5h6M9 17h4"/></svg>
              <span data-i18n="savePdf">PDF report</span>
            </button>
            <button class="btn subtle icon" id="btn-delete" data-i18n-title="delete" data-i18n-aria="delete"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button>
          </div>
        </div>

        <div class="stats inset">
          <div class="stat"><div class="k" id="d-attended">—</div><div class="lbl eyebrow" data-i18n="statAttended"></div></div>
          <div class="stat"><div class="k" id="d-avg">—</div><div class="lbl eyebrow" data-i18n="statAvgPresence"></div></div>
          <div class="stat"><div class="k" id="d-share">—</div><div class="lbl eyebrow" data-i18n="statAvgShare"></div></div>
          <div class="stat"><div class="k" id="d-length">—</div><div class="lbl eyebrow" data-i18n="statLength"></div></div>
        </div>

        <div class="sect">
          <div class="sect-head"><div class="eyebrow" data-i18n="timelineTitle"></div><div class="eyebrow soft" data-i18n="timelineHint"></div></div>
          <div class="timeline" id="timeline"></div>
        </div>

        <div class="sect">
          <div class="sect-head" id="attendance-head"><div class="eyebrow" data-i18n="attendanceTitle"></div>
            <div class="search inline"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input class="field" id="participant-search" data-i18n-placeholder="searchPeople" data-i18n-aria="searchPeople"></div>
          </div>
          <table class="rc-table" id="attendance-table"><tbody id="attendance-body"></tbody></table>
        </div>
      </div>
    </section>

    <!-- ============ GROUPS ============ -->
    <section class="view" id="view-groups">
      <div class="view-head">
        <div>
          <div class="eyebrow" data-i18n="navGroups">Series</div>
          <p class="lede" data-i18n="groupsSubtitle" id="groups-lede"></p>
        </div>
        <div class="head-actions">
          <button class="btn ghost" id="btn-groups-archive">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="4" width="18" height="5" rx="1.2"/><path d="M5 9v10.5h14V9M10 13h4"/></svg>
            <span class="lbl"></span>
          </button>
          <button class="btn" id="btn-new-group">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            <span data-i18n="newGroup">New series</span>
          </button>
        </div>
      </div>
      <div id="series-suggestions"></div>
      <div id="groups-list"></div>
      <div class="empty" id="groups-empty">
        <div class="mark"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></div>
        <h3 data-i18n="emptyGroupsTitle" id="groups-empty-title"></h3>
        <p data-i18n="emptyGroupsBody" id="groups-empty-body"></p>
      </div>
    </section>

    <!-- ============ GROUP DETAIL ============ -->
    <section class="view" id="view-group">
      <button class="back" id="btn-back-group"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg><span data-i18n="navGroups"></span></button>
      <div class="card detail-card">
        <div class="detail-head">
          <div class="detail-headings">
            <div class="eyebrow" id="group-eyebrow"></div>
            <div class="title-line">
              <div class="title-slot">
                <h1 id="group-title"></h1>
                <input class="field rename-input" id="group-rename-input" data-i18n-aria="rename" hidden>
              </div>
              <button class="title-edit" id="btn-group-rename" data-i18n-title="rename" data-i18n-aria="rename"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 3a2.83 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg></button>
              <button class="title-edit" id="btn-group-archive"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="5" rx="1.2"/><path d="M5 9v10.5h14V9M10 13h4"/></svg></button>
            </div>
            <div class="detail-badges"><div class="detail-meta mono" id="group-meta"></div></div>
          </div>
          <div class="detail-actions">
            <button class="btn ghost" id="btn-group-export">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3v12m0 0 4.5-4.5M12 15l-4.5-4.5"/><path d="M4 16.5V19a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2.5"/></svg>
              <span data-i18n="exportCsv">Export CSV</span>
            </button>
            <button class="btn" id="btn-group-pdf">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13.5h6M9 17h4"/></svg>
              <span data-i18n="savePdf">PDF report</span>
            </button>
            <button class="btn subtle icon" id="btn-group-delete" data-i18n-title="delete" data-i18n-aria="delete"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg></button>
          </div>
        </div>

        <div class="stats inset">
          <div class="stat"><div class="k" id="g-sessions">—</div><div class="lbl eyebrow" data-i18n="colSessions"></div></div>
          <div class="stat"><div class="k" id="g-people">—</div><div class="lbl eyebrow" data-i18n="colGroupPeople"></div></div>
          <div class="stat"><div class="k" id="g-attendance">—</div><div class="lbl eyebrow" data-i18n="statAvgAttendance"></div></div>
          <div class="stat"><div class="k" id="g-length">—</div><div class="lbl eyebrow" data-i18n="statAvgLength"></div></div>
        </div>

        <div class="sect">
          <div class="sect-head" id="matrix-head"><div class="eyebrow" data-i18n="matrixTitle"></div></div>
          <div class="matrix-wrap"><table class="rc-table matrix" id="group-matrix"></table></div>
        </div>

        <div class="sect">
          <div class="sect-head">
            <div class="sect-head-text"><div class="eyebrow" data-i18n="groupSessionsTitle"></div><div class="eyebrow soft" data-i18n="groupSessionsHint"></div></div>
            <button class="btn ghost" id="btn-add-meetings">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16.5" rx="2"/><path d="M3 9.5h18"/><path d="M12 13v5M9.5 15.5h5"/></svg>
              <span data-i18n="addMeetings">Add meetings</span>
            </button>
          </div>
          <table class="rc-table sessions-table" id="group-sessions"></table>
        </div>

        <div class="sect">
          <div class="sect-head"><div class="eyebrow" data-i18n="groupRosterTitle"></div></div>
          <p class="hint" data-i18n="groupRosterHint"></p>
          <div class="roster-editor">
            <input class="field" id="group-roster-input" data-i18n-placeholder="rosterPlaceholder" data-i18n-aria="groupRosterTitle">
            <button class="btn ghost" id="group-roster-add">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
              <span data-i18n="add"></span>
            </button>
          </div>
          <div class="chips" id="group-roster-chips"></div>
        </div>
      </div>
    </section>

    <!-- ============ PEOPLE ============ -->
    <section class="view" id="view-people">
      <div class="view-head">
        <div>
          <div class="eyebrow" data-i18n="navPeople">People</div>
          <p class="lede" data-i18n="peopleSubtitle"></p>
        </div>
        <div class="head-actions">
          <div class="search"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input class="field" id="people-search" data-i18n-placeholder="searchPeople" data-i18n-aria="searchPeople"></div>
        </div>
      </div>
      <div class="card list-card" id="people-table">
        <div class="list-head people-grid">
          <span data-i18n="colName"></span><span class="num" data-i18n="colMeetingsCount"></span>
          <span class="num" data-i18n="colTotalTimeP"></span><span data-i18n="colAvgRate"></span>
          <span class="num" data-i18n="colLastSeen"></span>
        </div>
        <div id="people-body"></div>
      </div>
      <div class="empty" id="people-empty">
        <div class="mark"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 6a3 3 0 0 1 0 6M21 20c0-2.5-1.5-4.6-3.6-5.5"/></svg></div>
        <h3 data-i18n="emptyPeopleTitle"></h3>
        <p data-i18n="emptyPeopleBody"></p>
      </div>
    </section>

    <!-- ============ ANALYTICS ============ -->
    <section class="view" id="view-analytics">
      <div class="view-head">
        <div>
          <div class="eyebrow" data-i18n="navAnalytics">Analytics</div>
          <p class="lede" data-i18n="analyticsSubtitle"></p>
        </div>
        <div class="head-actions">
          <button class="btn ghost" id="btn-analytics-csv">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 3v12m0 0 4.5-4.5M12 15l-4.5-4.5"/><path d="M4 16.5V19a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2.5"/></svg>
            <span data-i18n="exportCsv">Export CSV</span>
          </button>
        </div>
      </div>

      <div id="analytics-body">
        <!-- one filter row, scoping every chart and read-out below it -->
        <div class="card filterbar" id="filterbar">
          <div class="fb-line">
            <span class="fb-key eyebrow" data-i18n="filterRange"></span>
            <div class="segmented" id="range-seg">
              <button type="button" data-preset="7d" data-i18n="range7"></button>
              <button type="button" data-preset="30d" data-i18n="range30"></button>
              <button type="button" data-preset="90d" data-i18n="range90"></button>
              <button type="button" data-preset="365d" data-i18n="range365"></button>
              <button type="button" data-preset="all" data-i18n="rangeAll"></button>
            </div>
            <div class="fb-dates">
              <input class="field mono" type="date" id="range-from" data-i18n-aria="filterFrom" data-i18n-title="filterFrom">
              <span class="fb-dash">–</span>
              <input class="field mono" type="date" id="range-to" data-i18n-aria="filterTo" data-i18n-title="filterTo">
            </div>
          </div>
          <div class="fb-line">
            <span class="fb-key eyebrow" data-i18n="filterSeries"></span>
            <div class="picker" id="pick-series"></div>
            <span class="fb-key eyebrow" data-i18n="filterMeetings"></span>
            <div class="picker" id="pick-titles"></div>
            <button class="btn subtle" id="filters-reset" hidden>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1L3 8.5"/><path d="M3 3.5v5h5"/></svg>
              <span data-i18n="filterReset"></span>
            </button>
          </div>
          <div class="fb-summary mono" id="filter-summary"></div>
        </div>

        <div class="stats kpi" id="analytics-kpi"></div>

        <div class="charts" id="charts">
          <div class="card chart-card wide" data-chart="activity">
            <div class="cc-head">
              <div><div class="eyebrow" data-i18n="chartActivity"></div><div class="cc-sub mono" id="sub-activity"></div></div>
